<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>World Clock by Natalia Śliwińska</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Choose a city...</option>
        <option value="">Warsaw</option>
        <option value="">New York</option>
        <option value="">Tokyo</option>
        <option value="">Sydney</option>
      </select>

      <div class="city">
        <div>
          <h2>Warsaw 🇵🇱</h2>
          <div class="date">September 22nd 2026</div>
        </div>
        <div class="time">16:45 <small>PM</small></div>
      </div>

      <div class="city">
        <div>
          <h2>New York 🇺🇸</h2>
          <div class="date">September 22nd 2026</div>
        </div>
        <div class="time">16:45 <small>PM</small></div>
      </div>

      <footer>
        Coded by <strong>Natalia Śliwińska</strong>
        and it's open-sourced on
        <a href="https://github.com/NataliaSliwinska" target="blank"> GitHub</a>
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
