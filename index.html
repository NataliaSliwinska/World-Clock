<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <title>World Clock by Natalia Śliwińska</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select id="city">
        <option value="">Choose a city...</option>
        <option value="Europe/Warsaw">Warsaw</option>
        <option value="America/New_York">New York</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Australia/Sydney">Sydney</option>
      </select>
      <div class="cities">
        <div class="city" id="warsaw">
          <div>
            <h2>Warsaw 🇵🇱</h2>
            <div class="date"></div>
          </div>
          <div class="time">></div>
        </div>

        <div class="city" id="new-york">
          <div>
            <h2>New York 🇺🇸</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
      <footer>
        Coded by <strong>Natalia Śliwińska</strong>
        and it's open-sourced on
        <a href="https://github.com/NataliaSliwinska" target="blank"> GitHub</a>
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
